version: 2

sources:
  - name: raw
    database: economic_bi_db
    schema: raw
    tables:
      - name: fred_observations
        description: "Macroeconomic series observations directly ingested from the St. Louis FRED API."
        columns:
          - name: series_id
            tests:
              - not_null
          - name: observation_date
            tests:
              - not_null

      - name: world_bank_indicators
        description: "Cross-country development and financial indicators ingested from the World Bank API."
        columns:
          - name: country_iso3
            tests:
              - not_null
          - name: indicator_code
            tests:
              - not_null
          - name: observation_year
            tests:
              - not_null
